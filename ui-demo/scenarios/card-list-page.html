<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡片列表页场景</title>
  <link rel="stylesheet" href="../packages/design-system/src/base.css" />
  <link rel="stylesheet" href="../packages/design-system/src/Button/index.css" />
  <link rel="stylesheet" href="../packages/design-system/src/Field/index.css" />
  <link rel="stylesheet" href="../packages/design-system/src/FilterBar/index.css" />
  <link rel="stylesheet" href="../packages/design-system/src/Tabs/index.css" />
  <link rel="stylesheet" href="../packages/design-system/src/Card/index.css" />
  <link rel="stylesheet" href="../packages/design-system/src/Pagination/index.css" />
  <link rel="stylesheet" href="../packages/design-system/src/CardListTemplate/index.css" />
  <style>
    body {
      margin: 0;
      background: #eef0f5;
      font-family: var(--ds-font-family);
    }

    .scene-shell {
      min-width: 0;
      min-height: 100vh;
      padding: 20px;
    }

    .scene-shell .ds-card-list-template {
      max-width: 1240px;
      margin: 0 auto;
    }

    .scene-filter-field {
      display: grid;
      min-width: 0;
      grid-template-columns: 110px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .scene-filter-field label {
      color: var(--ds-color-text-secondary);
      font-size: 14px;
      line-height: 20px;
      text-align: right;
    }

    .scene-filter-field .ds-input,
    .scene-filter-field .ds-select {
      width: 100%;
      height: 32px;
    }

    .scene-toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      padding: 8px 12px;
      color: #fff;
      background: rgba(25, 26, 35, .88);
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: 160ms ease;
    }

    .scene-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .scene-shell {
        padding: 8px;
      }

      .scene-filter-field {
        grid-template-columns: 1fr;
      }

      .scene-filter-field label {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="scene-shell ds-scope">
    <section class="ds-card-list-template">
      <header class="ds-card-list-template__header">
        <nav class="ds-tabs ds-tabs--section ds-card-list-template__tabs" aria-label="页签">
          <span class="ds-tabs__entry is-active">
            <button class="ds-tabs__item is-active" type="button" data-tab="all"><span class="ds-tabs__label">选项</span></button>
          </span>
          <span class="ds-tabs__entry">
            <button class="ds-tabs__item" type="button" data-tab="other"><span class="ds-tabs__label">选项</span></button>
          </span>
        </nav>
        <button class="ds-card-list-template__meta" type="button" data-action="切换标题选项">
          <span>标题：</span><strong>选项</strong><span class="ds-card-list-template__dropdown-icon" aria-hidden="true"></span>
        </button>
      </header>

      <div class="ds-card-list-template__content">
        <section class="ds-filter-area" aria-label="筛选区域">
          <div class="ds-filter-area__panel">
            <div class="ds-filter-area__fields">
              <div class="scene-filter-field">
                <label for="schemeName">评价方案名称</label>
                <input class="ds-input" id="schemeName" placeholder="请输入" />
              </div>
              <div class="scene-filter-field">
                <label for="publishStatus">启用状态</label>
                <select class="ds-select" id="publishStatus">
                  <option value="all">全部</option>
                  <option value="published">已发布</option>
                  <option value="draft">未发布</option>
                </select>
              </div>
            </div>
            <div class="ds-filter-area__actions">
              <button class="ds-button ds-button--default" id="resetButton" type="button">重置</button>
              <button class="ds-button ds-button--primary" id="searchButton" type="button">查询</button>
            </div>
          </div>
        </section>

        <div class="ds-card-list-template__toolbar">
          <div class="ds-card-list-template__toolbar-actions">
            <button class="ds-button ds-button--primary" type="button" data-action="新增">按钮</button>
            <button class="ds-button ds-button--default" type="button" data-action="批量操作">按钮</button>
            <button class="ds-button ds-button--default" type="button" data-action="导出报表">导出报表</button>
            <button class="ds-button ds-button--default" type="button" data-action="批量下载">批量下载</button>
            <button class="ds-button ds-button--default" type="button" data-action="导入">导入</button>
            <button class="ds-button ds-button--default" type="button" data-action="导出">导出⌄</button>
            <button class="ds-button ds-button--default" type="button" data-action="排序查询">排序查询</button>
          </div>
          <div class="ds-card-list-template__tools" aria-label="卡片列表工具">
            <button class="ds-card-list-template__tool is-fullscreen" type="button" aria-label="全屏" data-action="全屏"></button>
            <button class="ds-card-list-template__tool is-columns" type="button" aria-label="显示设置" data-action="显示设置"></button>
          </div>
        </div>

        <div class="ds-card-list-template__grid" id="cardGrid"></div>
      </div>

      <footer class="ds-card-list-template__footer">
        <div class="ds-pagination ds-card-list-template__pagination">
          <span id="totalCount">共 6 条</span>
          <span>共 1 页</span>
          <button class="ds-link-button" type="button" data-page="previous">上一页</button>
          <strong class="ds-pagination__current">1</strong>
          <button class="ds-link-button" type="button" data-page="next">下一页</button>
          <label class="ds-pagination__jump">跳至 <input class="ds-input" value="1" aria-label="跳转页码" /> 页</label>
          <select class="ds-select" aria-label="每页条数"><option>10 条/页</option><option>20 条/页</option></select>
        </div>
      </footer>
    </section>
  </main>

  <div class="scene-toast" id="toast" role="status"></div>

  <script>
    const initialCards = Array.from({ length: 6 }, (_, index) => ({
      id: index + 1,
      title: '教师数据中心',
      published: index % 3 !== 0,
      updatedAt: '2025-06-03 00:00:00',
      administrator: index % 3 !== 0 ? '张老师、李老师、王老师、赵老师' : '-',
      incomplete: index % 3 === 1
    }));

    let cards = initialCards.map((card) => ({ ...card }));
    let visibleCards = cards;
    let toastTimer;

    const cardGrid = document.getElementById('cardGrid');
    const totalCount = document.getElementById('totalCount');
    const nameInput = document.getElementById('schemeName');
    const statusSelect = document.getElementById('publishStatus');
    const toast = document.getElementById('toast');

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('is-visible');
      toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1600);
    }

    function renderCards() {
      if (!visibleCards.length) {
        cardGrid.innerHTML = '<div class="ds-card-list-template__empty">暂无符合条件的卡片</div>';
      } else {
        cardGrid.innerHTML = visibleCards.map((card) => `
          <section class="ds-card ds-card-component ds-card-component--short ds-card-component--list-item ds-card-component--padded" data-card-id="${card.id}">
            <header class="ds-card-component__header">
              <div class="ds-card-component__heading">
                <strong class="ds-card-component__title" title="${card.title}">${card.title}</strong>
                <span class="ds-card-component__status ds-card-component__status--${card.published ? 'success' : 'neutral'}">${card.published ? '已发布' : '未发布'}</span>
              </div>
            </header>
            <div class="ds-card-component__body">
              <div class="ds-card-component__content">
                <dl class="ds-card-component__fields">
                  <div class="ds-card-component__field"><dt>最近修改时间：</dt><dd>${card.updatedAt}</dd></div>
                  <div class="ds-card-component__field"><dt>管理员：</dt><dd title="${card.administrator}">${card.administrator}</dd></div>
                </dl>
                ${card.incomplete ? `
                  <div class="ds-card-component__notice ds-card-component__notice--warning" role="status">
                    <span class="ds-card-component__notice-icon" aria-hidden="true"></span>
                    <span class="ds-card-component__notice-content">对象未设置完整</span>
                    <button class="ds-card-component__notice-action" type="button" data-card-action="configure">
                      <span>设置对象</span><span class="ds-card-component__notice-arrow" aria-hidden="true"></span>
                    </button>
                  </div>` : ''}
              </div>
            </div>
            <footer class="ds-card-component__footer">
              <div class="ds-card-component__actions" role="group" aria-label="卡片操作">
                <button class="ds-card-component__action ds-card-component__action--button" type="button" data-card-action="delete">删除</button>
                <button class="ds-card-component__action ds-card-component__action--button" type="button" data-card-action="visit">访问</button>
                <button class="ds-card-component__action ds-card-component__action--button" type="button" data-card-action="publish">${card.published ? '取消发布' : '发布'}</button>
                <button class="ds-card-component__action ds-card-component__action--button" type="button" data-card-action="edit">编辑</button>
              </div>
            </footer>
          </section>
        `).join('');
      }
      totalCount.textContent = `共 ${visibleCards.length} 条`;
    }

    function filterCards() {
      const keyword = nameInput.value.trim().toLowerCase();
      const status = statusSelect.value;
      visibleCards = cards.filter((card) => {
        const nameMatches = !keyword || card.title.toLowerCase().includes(keyword);
        const statusMatches = status === 'all'
          || (status === 'published' && card.published)
          || (status === 'draft' && !card.published);
        return nameMatches && statusMatches;
      });
      renderCards();
      showToast(`查询完成，共 ${visibleCards.length} 条`);
    }

    document.getElementById('searchButton').addEventListener('click', filterCards);
    document.getElementById('resetButton').addEventListener('click', () => {
      nameInput.value = '';
      statusSelect.value = 'all';
      visibleCards = cards;
      renderCards();
      showToast('筛选条件已重置');
    });

    cardGrid.addEventListener('click', (event) => {
      const actionButton = event.target.closest('[data-card-action]');
      const cardElement = event.target.closest('[data-card-id]');
      if (!actionButton || !cardElement) return;

      const card = cards.find((item) => item.id === Number(cardElement.dataset.cardId));
      if (!card) return;

      const action = actionButton.dataset.cardAction;
      if (action === 'delete') {
        cards = cards.filter((item) => item.id !== card.id);
        filterCards();
        showToast('卡片已删除');
        return;
      }
      if (action === 'publish') {
        card.published = !card.published;
        filterCards();
        showToast(card.published ? '已发布' : '已取消发布');
        return;
      }
      if (action === 'configure') {
        card.incomplete = false;
        renderCards();
        showToast('对象设置已完成');
        return;
      }
      showToast(`${action === 'visit' ? '访问' : '编辑'}：${card.title}`);
    });

    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]');
      if (action) showToast(`${action.dataset.action}操作`);

      const tab = event.target.closest('[data-tab]');
      if (tab) {
        document.querySelectorAll('[data-tab]').forEach((item) => {
          const active = item === tab;
          item.classList.toggle('is-active', active);
          item.parentElement.classList.toggle('is-active', active);
        });
      }

      const page = event.target.closest('[data-page]');
      if (page) showToast('当前示例仅有 1 页');
    });

    renderCards();
  </script>
</body>
</html>

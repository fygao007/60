<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教师成长档案系统</title>
  <link rel="stylesheet" href="./packages/design-system/src/base.css" />
  <link rel="stylesheet" href="./packages/design-system/src/AppShell/app-shell.css" />
  <style>
    .archive-page{flex:1;min-height:0;overflow:auto;padding:0 16px 16px;background:#fff}
    .archive-surface{min-height:100%;padding:18px;background:#f5f7fb;border:1px solid #edf0f5;border-radius:4px}
    .hero-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:#0f1114;font-size:20px;font-weight:700}
    .subtle{color:#86909c;font-size:12px;font-weight:400}
    .toolbar-spacer{flex:1}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-width:68px;height:32px;padding:0 14px;color:#4e5969;background:#fff;border:1px solid #d9dce3;border-radius:4px;font-size:13px;cursor:pointer}
    .btn.primary{color:#fff;background:var(--ds-color-primary);border-color:var(--ds-color-primary)}
    .input,.select{height:32px;padding:0 10px;color:#1f2329;background:#fff;border:1px solid #d9dce3;border-radius:4px;outline:none;font-size:13px}
    .input{min-width:220px}.select{min-width:120px}
    .card{background:#fff;border:1px solid #edf0f5;border-radius:8px;box-shadow:0 4px 16px rgba(31,35,41,.05)}
    .card-hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #edf0f5;font-weight:700}
    .card-bd{padding:16px}
    .grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .info-item{min-height:74px;padding:12px;background:#f7f9fc;border-radius:6px}
    .info-label{color:#86909c;font-size:12px}.info-value{margin-top:8px;color:#0f63c7;font-weight:700}
    .accordion{overflow:hidden;margin-bottom:14px;border-radius:8px}.accordion .card-hd{color:#fff;background:linear-gradient(90deg,#2f63f3,#3f8cff)}
    .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;color:#f26d1d;background:#fff4ea;border:1px solid #ffd8b5;border-radius:999px;font-size:12px}
    .metric{display:flex;align-items:center;gap:12px;min-height:72px;padding:14px;background:#eaf6ff;border:1px solid #cfeeff;border-radius:8px}
    .metric-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#fff;font-size:20px}
    .metric strong{display:block;color:#0f63c7;font-size:20px;line-height:24px}.metric span{color:#4e5969;font-size:12px}
    .overview-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:14px;padding:18px;background:linear-gradient(135deg,#fff 0%,#eef4ff 100%);border:1px solid #dce6ff;border-radius:10px}
    .teacher-line{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .teacher-avatar{display:grid;place-items:center;width:52px;height:52px;color:#fff;background:linear-gradient(135deg,#2f63f3,#35b3ff);border-radius:14px;font-size:22px;font-weight:800}
    .teacher-main{font-size:20px;font-weight:800}.overview-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .stat-card{position:relative;min-height:112px;padding:18px;background:#fff;border:1px solid #edf0f5;border-radius:10px;box-shadow:0 4px 16px rgba(31,35,41,.05);overflow:hidden}
    .stat-card::after{content:"";position:absolute;right:-24px;top:-24px;width:72px;height:72px;background:var(--ds-color-primary-light);border-radius:50%}
    .stat-label{color:#86909c;font-size:12px}.stat-value{margin-top:8px;color:#0f63c7;font-size:24px;font-weight:800}.stat-note{margin-top:8px;color:#4e5969;font-size:12px}
    .detail-panel{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #d9dce3}.detail-panel.open{display:block}
    .detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.detail-item{padding:10px;background:#f7f9fc;border-radius:6px}.detail-item b{display:block;margin-bottom:4px}
    .section-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .small-table{width:100%;border-collapse:collapse;font-size:13px}.small-table th,.small-table td{height:34px;padding:0 10px;border-bottom:1px solid #edf0f5;text-align:left}.small-table th{background:#f7f8fa}
    .profile-head{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;margin-bottom:14px}.avatar-xl{display:grid;place-items:center;width:72px;height:72px;color:#fff;background:linear-gradient(135deg,#6c7cff,#35b3ff);border-radius:50%;font-size:28px;font-weight:800}
    .timeline-card{min-height:92px;padding:12px;background:#fff9e8;border:1px solid #ffe4a8;border-radius:8px}.photo{height:190px;border-radius:6px;background:linear-gradient(135deg,#f0c56a,#8db0d9);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700}
    .radar-wrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:18px;align-items:center}.radar{width:330px;height:250px;margin:auto;background:conic-gradient(from 0deg,rgba(48,63,255,.10),rgba(31,157,85,.12),rgba(48,63,255,.10));clip-path:polygon(50% 3%,82% 18%,97% 50%,82% 82%,50% 97%,18% 82%,3% 50%,18% 18%);border:2px solid #7bd8c4;position:relative}.radar::after{content:"";position:absolute;inset:52px;background:rgba(48,63,255,.22);clip-path:polygon(50% 8%,75% 24%,83% 54%,62% 78%,35% 71%,18% 48%,28% 20%);border:2px solid #2f63f3}
    .bar-row{display:grid;grid-template-columns:170px 1fr 58px 42px;gap:10px;align-items:center;height:32px;font-size:12px}.bar-track{height:6px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:#f5a000;border-radius:99px}
    .warn-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:8px;border:1px solid}.warn-blue{background:#eaf6ff;border-color:#cfeeff}.warn-red{background:#fff0f0;border-color:#ffb8b8}.warn-yellow{background:#fff8db;border-color:#ffe58f}.warn-green{background:#effaf2;border-color:#a7e5b8}
    .list-row{display:flex;align-items:center;gap:14px;min-height:44px;margin-bottom:8px;padding:0 12px;border-radius:6px;background:#fff7f7;border-left:3px solid #ff7875;font-size:13px}.list-row.yellow{background:#fffbe6;border-left-color:#f5a000}.list-row .row-btn{margin-left:auto}
    .compare-head{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-bottom:14px}.vs{display:grid;place-items:center;width:38px;height:38px;color:#ff4d4f;background:#fff1f0;border-radius:50%;font-weight:800}.compare-card{padding:18px;border-radius:8px;background:#fff;border:2px solid #2f63f3}.compare-card.red{border-color:#ff4d4f}.teacher-name{text-align:center;font-size:18px;font-weight:800}
    @media(max-width:1280px){.grid-4,.overview-stats,.section-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.radar-wrap,.compare-head{grid-template-columns:1fr}.vs{margin:auto}}
  </style>
</head>
<body>
<div class="stage ds-scope">
  <header class="operation-header">
    <div class="operation-title"><span id="pageTitle">教师数据概览</span></div>
    <div class="operation-header-spacer"></div>
    <div class="operation-buttons" id="pageActions"></div>
  </header>
  <main class="archive-page"><div id="pageRoot" class="archive-surface"></div></main>
</div>
<script src="./assets/icon-registry.js"></script>
<script src="./packages/design-system/src/AppShell/app-shell.js"></script>
<script>
const pages = {
  '教师数据概览': renderOverview,
  '成长档案': renderGrowth,
  '画像概览': renderPortrait,
  '教师发展预警': renderWarning,
  '教师能力对比': renderCompare
};
function setActions(html=''){document.getElementById('pageActions').innerHTML=html;}
function renderFeature(name){const fn=pages[name]||renderOverview;document.getElementById('pageTitle').textContent=name;document.getElementById('pageRoot').innerHTML=fn();}
function renderOverview(){
  setActions('<button class="operation-button">同步数据</button><button class="operation-button primary">导出概览</button>');
  return `
    <section class="overview-hero"><div><div class="teacher-line"><div class="teacher-avatar">张</div><div><div class="teacher-main">张三 · 副教授</div><div class="subtle">T2019001｜信息工程学院｜计算机科学与技术｜入职 2019-09</div></div></div><div class="subtle">数据已汇聚人事、教学、科研、竞赛、学生评价等 7 类来源，最近更新：2026-05-13 10:20</div></div><button class="btn primary" data-detail-toggle="base">查看基础明细</button></section>
    <section class="overview-stats">${[['480','年度课时','较去年 +12%','📘'],['92.5','学生评价','学院前 20%','⭐'],['6','科研项目','主持 2 项','⚗'],['10','论文成果','核心 4 篇','📄']].map(x=>`<div class="stat-card"><div class="stat-label">${x[3]} ${x[1]}</div><div class="stat-value">${x[0]}</div><div class="stat-note">${x[2]}</div></div>`).join('')}</section>
    <section class="accordion card"><div class="card-hd">👤 教师基础数据 <span class="toolbar-spacer"></span><button class="btn" data-detail-toggle="base">展开详情</button><button class="btn primary">导出</button></div><div class="card-bd"><div class="info-grid">${['姓名|张三','工号|T2019001','性别|男','出生年月|1985-06','所在部门|信息工程学院','职务/职称|副教授','政治面貌|群众','最高学历|博士研究生'].map(item=>field(item)).join('')}</div><div class="detail-panel" data-detail-panel="base"><div class="detail-grid">${['最高学位|博士','毕业院校|XX大学','所学专业|计算机科学与技术','导师资格|硕士生导师','人才称号|校级青年骨干','入职时间|2019-09'].map(item=>detail(item)).join('')}</div></div></div></section>
    ${[
      ['人事数据','person','▣',['年度考核|优秀','培训记录|5 次','聘期状态|正常','合同状态|有效'],['2025 年度考核优秀','完成青年教师能力提升培训','聘期 2023-2026，进度正常']],
      ['教学数据','teach','▤',['学时|480 课时','课程|6 门','学生评价|92.5 分','教学竞赛|省级 2 项'],['承担本科课程 4 门、研究生课程 2 门','学生评价高于学院平均 7.8 分','指导课程设计与毕业论文共 18 人']],
      ['科研数据','research','⚗',['课题|6 项','论文|10 篇','专利|3 件','到账经费|125 万元'],['主持省部级项目 2 项、横向项目 3 项','近三年核心论文 4 篇，普通论文 6 篇','科研经费年度到账 45 万元']]
    ].map(([t,key,icon,summary,details])=>`<section class="accordion card"><div class="card-hd">${icon} ${t}<span class="toolbar-spacer"></span><button class="btn" data-detail-toggle="${key}">展开详情</button><button class="btn primary">导出</button></div><div class="card-bd"><div class="section-summary">${summary.map(item=>field(item)).join('')}</div><div class="detail-panel" data-detail-panel="${key}"><table class="small-table"><thead><tr><th>明细事项</th><th>状态</th><th>更新时间</th></tr></thead><tbody>${details.map(d=>`<tr><td>${d}</td><td><span class="tag">正常</span></td><td>2026-05-13</td></tr>`).join('')}</tbody></table></div></div></section>`).join('')}
  `;
}
function field(text){const [a,b]=text.split('|');return `<div class="info-item"><div class="info-label">${a}</div><div class="info-value">${b}</div></div>`}
function detail(text){const [a,b]=text.split('|');return `<div class="detail-item"><b>${a}</b><span class="subtle">${b}</span></div>`}
function renderGrowth(){setActions('<button class="operation-button">生成报告</button><button class="operation-button primary">导出画像</button>');return `<div class="profile-head card" style="padding:16px"><div class="avatar-xl">张</div><div><h1 class="hero-title" style="margin:0">张明 <span class="tag">正高级</span><span class="tag">人工智能方向</span></h1><div class="subtle">工号：2004045　入职：2008-09　教龄：15年　成长档案完整度：优秀</div></div><button class="btn primary">查看完整档案</button></div><div class="grid grid-2"><section class="card"><div class="card-hd">🏆 成长高光</div><div class="card-bd"><div class="photo">课堂教学 / 团队指导照片</div><div class="subtle" style="text-align:center;margin-top:8px">指导学生实践项目</div></div></section><section class="card"><div class="card-hd">💡 业务推荐</div><div class="card-bd">${['国家级教学成果奖推荐','青年教师发展计划推荐','教学创新大赛推荐','课程思政示范课程申报'].map((t,i)=>`<div class="timeline-card" style="margin-bottom:10px;background:${i===3?'#eaf6ff':'#fff'}"><b>${t}</b><div class="subtle">匹配度 ${92-i*7}% · 依据近三年教学科研表现生成</div></div>`).join('')}</div></section></div><section class="card" style="margin-top:14px"><div class="card-hd">📊 职业目标诊断</div><div class="card-bd radar-wrap"><div class="radar"></div><div>${['教学成果产出','科研项目牵引','论文专利','学生培养质量','年度教学工作量','团队协作影响'].map((x,i)=>`<div class="bar-row"><span>${x}</span><div class="bar-track"><div class="bar-fill" style="width:${50+i*7}%"></div></div><span>${50+i*7}.0 / 85</span><b style="color:#f5a000">较强</b></div>`).join('')}</div></div></section>`}
function renderPortrait(){setActions('<button class="operation-button">趋势分析</button><button class="operation-button">智能分析</button><button class="operation-button primary">预警助手</button>');return `<h1 class="hero-title">📊 画像概览</h1><div class="grid grid-4">${['9|教师数量|👨‍🏫','2|博士学历|🎓','6|课程教学|📋','7|项目成果|💼','6|论文及专利|📚','39.3|平均年龄|🧮','3|35岁以下|🟢','1|人才称号|🌟'].map(m=>{let [n,t,icon]=m.split('|');return `<div class="metric"><div class="metric-icon">${icon}</div><div><strong>${n}</strong><span>${t}</span></div></div>`}).join('')}</div><section class="card" style="margin-top:16px;background:#eaf6ff;border-color:#cfeeff"><div class="card-hd">📈 组织工程学院 · 教师发展趋势分析</div><div class="card-bd"><p>• 博士学历占比提升，较 19% 提升至 22.2%</p><p>• 双师型教师占比提升到 85%</p><p>• 高级职称人数逐步增长，结构更均衡</p></div></section>`}
function renderWarning(){setActions('<button class="operation-button">全部导出</button><button class="operation-button primary">生成处置建议</button>');return `<h1 class="hero-title">⚠ 教师发展预警</h1><p class="subtle">按照职称晋升、企业实践、学历结构等关键阈值统计预警。</p><div class="grid grid-4">${warnCards()}</div><section class="card" style="margin-top:16px"><div class="card-hd">▣ 预警明细</div><div class="card-bd">${['教师24　讲师｜教学活动｜论文项目｜科研成果','教师28　讲师｜教学450课时｜论文项目｜科研项目','教师45　讲师｜教学410课时｜论文项目｜科研成果'].map((x,i)=>`<div class="list-row ${i===2?'yellow':''}"><span>${x}</span><button class="btn primary" style="margin-left:auto">查看详情</button></div>`).join('')}</div></section>`}
function renderCompare(){setActions('<button class="operation-button">导出对比</button><button class="operation-button primary">生成分析</button>');const bars=['基本情况','教学成果','教学工作量','企业实践','技能证书','教研成果','项目成果'].map((x,i)=>`<div class="bar-row"><span>${x}</span><div class="bar-track"><div class="bar-fill" style="width:${72-i*5}%"></div></div><span>${72-i*5}.0 / 88</span><b style="color:#f5a000">良好</b></div>`).join('');return `<h1 class="hero-title">📊 教师能力对比</h1><div class="compare-head"><label>教师1<input class="input" value="教师1（T2000001）"></label><div class="vs">VS</div><label>教师2<input class="input" value="教师6（T2000006）"></label></div><div class="grid grid-2"><section class="compare-card"><div class="teacher-name">教师1</div><div class="radar" style="width:260px;height:210px"></div>${bars}</section><section class="compare-card red"><div class="teacher-name">教师6</div><div class="radar" style="width:260px;height:210px;filter:hue-rotate(145deg)"></div>${bars}</section></div>`}
function warnCards(){return [['warn-blue','9','总人数','👥'],['warn-red','3','职称预警','🔴'],['warn-yellow','7','企业实践预警','🟡'],['warn-green','4','学历结构预警','🟢']].map(x=>`<div class="warn-card ${x[0]}"><div style="font-size:24px">${x[3]}</div><div><b style="font-size:20px">${x[1]}</b><div class="subtle">${x[2]}</div></div></div>`).join('')}
WiseAppShell.init({activeModule:'assessment',secondaryNav:{title:'教师成长档案',status:['菜单',5],items:['教师数据概览','成长档案','画像概览','教师发展预警','教师能力对比'],foot:'档案参数设置'},activeFeature:'教师数据概览',tabs:['教师数据概览','成长档案','画像概览','教师发展预警','教师能力对比'],userName:'管理员',onFeatureChange:renderFeature});
const primaryModules=[{key:'home',label:'工作台',icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4V5Z" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'},{key:'archive',label:'档案',icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 4h14v16H5V4Z" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'},{key:'assessment',label:'成长',icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'},{key:'warning',label:'预警',icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 4 21 20H3L12 4Z" stroke="currentColor" stroke-width="2"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'},{key:'compare',label:'对比',icon:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 5v14M18 5v14M9 8h6M9 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'}];
const primaryList=document.querySelector('.primary-nav-list');if(primaryList){primaryList.innerHTML=primaryModules.map(item=>`<a class="primary-nav-item${item.key==='assessment'?' active':''}" href="#" data-module="${item.key}"><span class="primary-nav-icon"><span class="wise-icon">${item.icon}</span></span><span class="primary-label">${item.label}</span></a>`).join('');}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-detail-toggle]');if(!btn)return;const p=document.querySelector('[data-detail-panel="'+btn.dataset.detailToggle+'"]');if(!p)return;p.classList.toggle('open');if(btn.tagName==='BUTTON')btn.textContent=p.classList.contains('open')?'收起详情':'展开详情';});
renderFeature('教师数据概览');
</script>
</body>
</html>

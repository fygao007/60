<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>条款库</title>
  <link rel="stylesheet" href="./packages/design-system/src/base.css" />
  <link rel="stylesheet" href="./packages/design-system/src/AppShell/app-shell.css" />
  <style>
    /* 仅本页差异：表格列宽 */
    .clause-table { min-width: 1480px; }
    .col-code     { width: 170px; }
    .col-name     { width: 240px; }
    .col-en       { width: 170px; }
    .col-scope    { width: 200px; }
    .col-category { width: 150px; }
    .col-standard { width: 130px; }
    .col-status   { width: 130px; }
    .col-actions  { width: 160px; }
  </style>
</head>
<body>
<div class="stage ds-scope">

  <!-- ====== 业务内容（init 后会被自动挪进 .operation-content） ====== -->

  <header class="operation-header">
    <div class="operation-title">条款库</div>
    <div class="operation-header-spacer"></div>
    <div class="operation-buttons">
      <button class="operation-button" type="button">新增</button>
      <button class="operation-button" type="button">删除</button>
      <button class="operation-button" type="button">导入</button>
      <button class="operation-button" type="button">导出</button>
    </div>
  </header>

  <div class="operation-query-row">
    <span class="query-label">关键字</span>
    <input class="query-input" placeholder="条款编号/条款名称" />
    <button class="operation-button" type="button">重置</button>
    <button class="operation-button primary" type="button">查询</button>
    <span class="query-spacer"></span>
    <div class="table-tools">
      <button class="operation-tool" type="button" aria-label="自定义列">☰</button>
      <button class="operation-tool" type="button" aria-label="最大化">⛶</button>
    </div>
  </div>

  <div class="operation-table-wrap">
    <div class="operation-table-scroll">
      <table class="operation-table clause-table">
        <colgroup>
          <col style="width:48px"><col style="width:40px">
          <col class="col-code"><col class="col-name"><col class="col-en">
          <col class="col-scope"><col class="col-category">
          <col class="col-standard"><col class="col-status"><col class="col-actions">
        </colgroup>
        <thead>
          <tr>
            <th class="col-drag"></th>
            <th class="col-check"><input type="checkbox" id="all" /></th>
            <th>条款编号</th>
            <th>条款名称</th>
            <th>条款英文名称</th>
            <th>适用业务</th>
            <th>条款分类</th>
            <th>是否标准条款</th>
            <th>启用状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer class="operation-footer">
    <span>共 12 条</span>
    <span>每页</span>
    <select class="page-size"><option>20</option><option>50</option><option>100</option></select>
    <span>条</span>
    <span class="operation-footer-spacer"></span>
    <div class="pages">
      <a class="dis">‹</a>
      <a class="cur">1</a>
      <a>›</a>
    </div>
    <span>跳至</span>
    <input class="jump-input" value="1" />
    <span>页</span>
  </footer>

</div>

<script src="./assets/icon-registry.js"></script>
<script src="./packages/design-system/src/AppShell/app-shell.js"></script>
<script>
  // ====== 框架壳子 ======
  WiseAppShell.init({
    activeModule: 'doctor',
    secondaryNav: {
      title: '协议管理',
      status: ['进行', 6],
      items: ['协议模板','条款库','机构管理','年级管理','引用配置','条款审核'],
      foot: '流程参数设置'
    },
    activeFeature: '条款库'
  });

  // ====== 业务数据 ======
  const rows = [
    {code:'TK-2026-001', name:'项目成果交付与验收条款',   en:'Delivery Acceptance', scope:'地大协议、任务书', category:'成果交付',   std:true,  on:true},
    {code:'TK-2026-014', name:'经费拨付节点与发票要求',   en:'-',                   scope:'地大协议',         category:'经费与支付', std:false, on:true},
    {code:'TK-2025-089', name:'知识产权归属与使用授权',   en:'-',                   scope:'地大协议、承诺书', category:'权利义务',   std:true,  on:true},
    {code:'TK-2025-072', name:'逾期交付违约责任',         en:'-',                   scope:'任务书',           category:'违约责任',   std:false, on:false},
    {code:'TK-2025-061', name:'协议变更与补充说明',       en:'-',                   scope:'地大协议',         category:'补充约定',   std:false, on:true},
    {code:'TK-2025-058', name:'保密义务与资料管理',       en:'-',                   scope:'承诺书',           category:'权利义务',   std:true,  on:true},
    {code:'TK-2025-049', name:'争议处理与适用规则',       en:'-',                   scope:'地大协议',         category:'争议处理',   std:false, on:true},
    {code:'TK-2025-036', name:'甲方验收责任',             en:'-',                   scope:'任务书',           category:'甲方义务',   std:false, on:true},
    {code:'TK-2025-022', name:'乙方材料提交要求',         en:'-',                   scope:'任务书',           category:'乙方义务',   std:false, on:true},
    {code:'TK-2025-018', name:'归档材料范围',             en:'-',                   scope:'地大协议',         category:'基础信息',   std:false, on:true},
    {code:'TK-2025-011', name:'联系人与通知送达',         en:'-',                   scope:'地大协议',         category:'基础信息',   std:false, on:true},
    {code:'TK-2024-098', name:'验收不通过处理',           en:'-',                   scope:'任务书',           category:'成果交付',   std:false, on:true},
  ];

  // ====== 渲染表格 + 行级交互 ======
  const dash = '<span class="dash">-</span>';
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="col-drag"><span class="drag-handle"></span></td>
      <td class="col-check"><input type="checkbox" class="row-chk" /></td>
      <td>${r.code}</td>
      <td title="${r.name}">${r.name}</td>
      <td>${r.en === '-' ? dash : r.en}</td>
      <td title="${r.scope}">${r.scope}</td>
      <td>${r.category}</td>
      <td>${r.std
        ? '<span class="ds-tag ds-tag--primary">标准</span>'
        : '<span class="ds-tag ds-tag--warning">自定义</span>'}</td>
      <td><span class="ds-switch ${r.on ? '' : 'off'}">${r.on ? '启用' : '停用'}</span></td>
      <td><span class="row-actions">
        <button class="ds-link-button">编辑</button>
        <button class="ds-link-button">详情</button>
        <button class="ds-link-button ds-link-button--danger">删除</button>
      </span></td>
    </tr>
  `).join('');

  // 全选 / 行选
  document.getElementById('all').addEventListener('change', e => {
    document.querySelectorAll('.row-chk').forEach(c => {
      c.checked = e.target.checked;
      c.closest('tr').classList.toggle('selected', e.target.checked);
    });
  });
  tbody.addEventListener('change', e => {
    if (e.target.classList.contains('row-chk')) {
      e.target.closest('tr').classList.toggle('selected', e.target.checked);
    }
  });
  // DSSwitch 切换
  tbody.addEventListener('click', e => {
    const sw = e.target.closest('.ds-switch');
    if (sw) { sw.classList.toggle('off'); sw.textContent = sw.classList.contains('off') ? '停用' : '启用'; }
  });
</script>
</body>
</html>

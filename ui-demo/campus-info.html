<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校区信息</title>
  <link rel="stylesheet" href="./packages/design-system/src/base.css" />
  <link rel="stylesheet" href="./packages/design-system/src/AppShell/app-shell.css" />
  <style>
    /* 仅本页差异：表格列宽 */
    .campus-table { min-width: 1640px; }
    .col-code    { width: 170px; }
    .col-name    { width: 200px; }
    .col-en      { width: 220px; }
    .col-area    { width: 220px; }
    .col-addr    { width: 220px; }
    .col-default { width: 130px; }
    .col-status  { width: 130px; }
    .col-actions { width: 160px; }
  </style>
</head>
<body>
<div class="stage ds-scope">

  <!-- ====== 业务内容（init 后会被自动挪进 .operation-content） ====== -->

  <header class="operation-header">
    <div class="operation-title">校区信息</div>
    <div class="operation-header-spacer"></div>
    <div class="operation-buttons">
      <button class="operation-button" type="button">新增</button>
      <button class="operation-button" type="button">删除</button>
      <button class="operation-button" type="button">导入</button>
      <button class="operation-button" type="button">导出</button>
    </div>
  </header>

  <div class="operation-query-row">
    <span class="query-label">关键字</span>
    <input class="query-input" placeholder="校区代码/校区名称" />
    <button class="operation-button" type="button">重置</button>
    <button class="operation-button primary" type="button">查询</button>
    <span class="query-spacer"></span>
    <div class="table-tools">
      <button class="operation-tool" type="button" aria-label="自定义列">☰</button>
      <button class="operation-tool" type="button" aria-label="最大化">⛶</button>
    </div>
  </div>

  <div class="operation-table-wrap">
    <div class="operation-table-scroll">
      <table class="operation-table campus-table">
        <colgroup>
          <col style="width:48px"><col style="width:40px">
          <col class="col-code"><col class="col-name"><col class="col-en">
          <col class="col-area"><col class="col-addr">
          <col class="col-default"><col class="col-status"><col class="col-actions">
        </colgroup>
        <thead>
          <tr>
            <th class="col-drag"></th>
            <th class="col-check"><input type="checkbox" id="all" /></th>
            <th>校区代码</th>
            <th>校区名称</th>
            <th>校区英文名称</th>
            <th>所属行政区划</th>
            <th>校区地址</th>
            <th>是否默认校区</th>
            <th>启用状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer class="operation-footer">
    <span>共 18 条</span>
    <span>每页</span>
    <select class="page-size"><option>20</option><option>50</option><option>100</option></select>
    <span>条</span>
    <span class="operation-footer-spacer"></span>
    <div class="pages">
      <a class="dis">‹</a>
      <a class="cur">1</a>
      <a>›</a>
    </div>
    <span>跳至</span>
    <input class="jump-input" value="1" />
    <span>页</span>
  </footer>

</div>

<script src="./assets/icon-registry.js"></script>
<script src="./packages/design-system/src/AppShell/app-shell.js"></script>
<script>
  // ====== 框架壳子 ======
  WiseAppShell.init({
    activeModule: 'prepare',
    secondaryNav: {
      title: '基础数据',
      status: ['进行', 6],
      items: ['院系信息','校区信息','专业信息','班级信息','校历管理','通用代码'],
      foot: '准备参数设置'
    },
    activeFeature: '校区信息'
  });

  // ====== 业务数据 ======
  const rows = [
    {code:'XSXKTESTXQ',name:'测试校区',en:'Test Campus',area:'-',addr:'-',def:'-',on:true},
    {code:'01',name:'主校区',     en:'Main Campus',          area:'江苏省南京市鼓楼区',   addr:'汉口路22号',         def:'是',on:true},
    {code:'02',name:'仙林校区',   en:'Xianlin Campus',       area:'江苏省南京市栖霞区',   addr:'仙林大道163号',      def:'否',on:true},
    {code:'03',name:'浦口校区',   en:'Pukou Campus',         area:'江苏省南京市浦口区',   addr:'学府路8号',          def:'否',on:true},
    {code:'04',name:'江北校区',   en:'Jiangbei Campus',      area:'江苏省南京市江北新区', addr:'天华东路30号',       def:'否',on:true},
    {code:'05',name:'苏州校区',   en:'Suzhou Campus',        area:'江苏省苏州市工业园区', addr:'仁爱路199号',        def:'否',on:true},
    {code:'06',name:'宿迁校区',   en:'Suqian Campus',        area:'江苏省宿迁市宿城区',   addr:'黄河南路399号',      def:'否',on:false},
    {code:'07',name:'盐城校区',   en:'Yancheng Campus',      area:'江苏省盐城市亭湖区',   addr:'希望大道中路1号',    def:'否',on:true},
    {code:'08',name:'无锡校区',   en:'Wuxi Campus',          area:'江苏省无锡市滨湖区',   addr:'蠡湖大道1800号',     def:'否',on:true},
    {code:'09',name:'常州校区',   en:'Changzhou Campus',     area:'江苏省常州市新北区',   addr:'晋陵北路200号',      def:'否',on:false},
    {code:'10',name:'徐州校区',   en:'Xuzhou Campus',        area:'江苏省徐州市铜山区',   addr:'上海路101号',        def:'否',on:true},
    {code:'11',name:'南通校区',   en:'Nantong Campus',       area:'江苏省南通市崇川区',   addr:'啬园路9号',          def:'否',on:true},
    {code:'12',name:'连云港校区', en:'Lianyungang Campus',   area:'江苏省连云港市海州区', addr:'苍梧路59号',         def:'否',on:true},
    {code:'13',name:'淮安校区',   en:'Huaian Campus',        area:'江苏省淮安市清江浦区', addr:'枚乘东路1号',        def:'否',on:false},
    {code:'14',name:'扬州校区',   en:'Yangzhou Campus',      area:'江苏省扬州市邗江区',   addr:'华扬西路199号',      def:'否',on:true},
    {code:'15',name:'镇江校区',   en:'Zhenjiang Campus',     area:'江苏省镇江市京口区',   addr:'学府路301号',        def:'否',on:true},
    {code:'16',name:'泰州校区',   en:'Taizhou Campus',       area:'江苏省泰州市海陵区',   addr:'济川东路2号',        def:'否',on:true},
    {code:'17',name:'国际学院',   en:'International College',area:'江苏省南京市玄武区',   addr:'四牌楼2号',          def:'否',on:true},
  ];

  const dash = '<span class="dash">-</span>';
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="col-drag"><span class="drag-handle"></span></td>
      <td class="col-check"><input type="checkbox" class="row-chk" /></td>
      <td>${r.code}</td>
      <td title="${r.name}">${r.name}</td>
      <td>${r.en === '-' ? dash : r.en}</td>
      <td title="${r.area}">${r.area === '-' ? dash : r.area}</td>
      <td title="${r.addr}">${r.addr === '-' ? dash : r.addr}</td>
      <td>${r.def === '是'
        ? '<span class="ds-tag ds-tag--primary">是</span>'
        : r.def === '否'
          ? '<span class="ds-tag ds-tag--warning">否</span>'
          : dash}</td>
      <td><span class="ds-switch ${r.on ? '' : 'off'}">${r.on ? '启用' : '停用'}</span></td>
      <td><span class="row-actions">
        <button class="ds-link-button">查看</button>
        <button class="ds-link-button">编辑</button>
        <button class="ds-link-button ds-link-button--danger">删除</button>
      </span></td>
    </tr>
  `).join('');

  // 全选 / 行选
  document.getElementById('all').addEventListener('change', e => {
    document.querySelectorAll('.row-chk').forEach(c => {
      c.checked = e.target.checked;
      c.closest('tr').classList.toggle('selected', e.target.checked);
    });
  });
  tbody.addEventListener('change', e => {
    if (e.target.classList.contains('row-chk')) {
      e.target.closest('tr').classList.toggle('selected', e.target.checked);
    }
  });
  // DSSwitch 切换
  tbody.addEventListener('click', e => {
    const sw = e.target.closest('.ds-switch');
    if (sw) { sw.classList.toggle('off'); sw.textContent = sw.classList.contains('off') ? '停用' : '启用'; }
  });
</script>
</body>
</html>
